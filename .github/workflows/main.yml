name: Build EWA Android Admin v0.5.5

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android-admin

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # 3. Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # 4. Install Android SDK packages
      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"


      # 5. Accept licenses
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true


      # 6. Install Gradle
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # 7. Verify project structure
      - name: Verify Android project
        run: |
          echo "======================================"
          echo "Checking Android project"
          echo "======================================"

          pwd

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "App:"
          ls -la app


      # 8. Clean
      - name: Clean project
        run: |
          gradle clean


      # 9. Build APK
      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace


      # 10. Verify APK
      - name: Verify APK
        run: |
          echo "======================================"
          echo "Checking generated APK"
          echo "======================================"

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          echo ""
          echo "APK SIZE:"
          ls -lh "$APK"


      # 11. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EWA-Android-Admin-v0.5.5
          path: android-admin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      # 12. Build summary
      - name: Build Summary
        run: |
          echo ""
          echo "=========================================="
          echo " EWA ANDROID ADMIN v0.5.5"
          echo " BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Generated APK:"
          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk"
